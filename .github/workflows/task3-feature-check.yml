name: Task 3 feature checks

on:
  push:
    branches: [feat/unit14-task3-wednesday-student-preview]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run src/lib/unit14-task3.test.ts
      - run: npm run lint
