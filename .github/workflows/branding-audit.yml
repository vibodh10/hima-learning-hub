name: Branding cleanup

on:
  push:
    branches: [fix/digital-learning-hub-branding]

permissions:
  contents: write

jobs:
  clean-branding:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining SCCB product branding
        run: |
          python - <<'PY'
          from pathlib import Path

          text_suffixes={'.ts','.tsx','.md','.html','.ps1','.sql','.yml','.yaml','.json','.webmanifest','.svg'}
          skip_parts={'.git','node_modules'}
          broad_pairs=[
              ('SCCB Digital Learning Hub','Digital Learning Hub'),
              ('SCCB Learning','Digital Learning Hub'),
              ('SCCB Hub','Digital Learning Hub'),
          ]
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'README.md'}:
                  continue
              if path.as_posix()=='.github/workflows/branding-audit.yml':
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated=text
              for old,new in broad_pairs:
                  updated=updated.replace(old,new)
              if updated!=text:
                  path.write_text(updated,encoding='utf-8')

          targeted={
            'src/app/access/page.tsx':[
              ('Ask an SCCB administrator for a setup link','Ask an administrator for a setup link'),
              ('approved and created securely by an SCCB administrator','approved and created securely by an administrator'),
              ('verified SCCB account','verified staff account'),
            ],
            'src/app/actions/learning.ts': [('`SCCB-${randomUUID()', '`DLH-${randomUUID()')],
            'src/app/actions/staff-accounts.ts': [('verified SCCB Teams account','verified staff Teams account')],
            'src/app/admin/page.tsx': [('an SCCB certificate','an institutional certificate')],
            'src/app/course-entry-readiness/page.tsx': [
              ('<Mark>S</Mark><span>SCCB <span className="text-teal-700">Digital Learning Hub</span></span>','<Mark>D</Mark><span>Digital Learning Hub</span>'),
            ],
            'src/app/help/page.tsx': [
              ('SCCB email','staff email'),('verified SCCB Teams account','verified staff Teams account')
            ],
            'src/app/join/[token]/page.tsx': [('Join your SCCB group','Join your learning group')],
            'src/app/register/teacher/page.tsx': [('Teacher registration | SCCB','Teacher registration | Digital Learning Hub')],
            'src/components/teacher-account-setup-form.tsx': [
              ('verified SCCB email','verified staff email'),
              ('verified SCCB Teams account','verified staff Teams account'),
            ],
            'src/lib/class-registration-links.ts': [('SCCB course','course')],
          }
          for filename,pairs in targeted.items():
              path=Path(filename)
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8')
              updated=text
              for old,new in pairs:
                  updated=updated.replace(old,new)
              if updated!=text:
                  path.write_text(updated,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Remove remaining SCCB product branding"
            git push
          fi
      - name: Show remaining SCCB references
        run: |
          echo 'Remaining SCCB references:'
          git grep -n -I 'SCCB' -- . ':(exclude).github/workflows/branding-audit.yml' || true
